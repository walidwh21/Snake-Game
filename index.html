<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<meta name="description" content="A modern, responsive Snake game in pure HTML, CSS and JavaScript.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
:root{--bg:#0b1020;--panel:#141b34;--text:#e8ecff;--muted:#8b94b8;--accent:#4ade80;--danger:#fb7185;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(circle at 50% 0%,#18224a,var(--bg) 60%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{width:100%;display:flex;gap:10px;align-items:center;justify-content:center}
.stat{background:var(--panel);border-radius:12px;padding:8px 16px;text-align:center;min-width:84px}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.icon{background:var(--panel);color:var(--text);border:0;border-radius:12px;width:46px;height:46px;font-size:20px;cursor:pointer}
.icon:hover{background:#1d2750}
.wrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #0008,0 0 0 2px #ffffff14}
canvas{display:block}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:#0b1020cc;backdrop-filter:blur(4px);padding:20px;transition:opacity .2s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{margin:0;font-size:34px}
#overlay p{margin:0;color:var(--muted);line-height:1.5}
#go{margin-top:6px;background:var(--accent);color:#052e16;border:0;border-radius:999px;padding:12px 28px;font-size:16px;font-weight:700;cursor:pointer}
#go:hover{filter:brightness(1.1)}
footer{color:var(--muted);font-size:13px;text-align:center}
kbd{background:var(--panel);border-radius:6px;padding:2px 7px;font-family:inherit}
</style>
</head>
<body>
<main>
  <header>
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat"><small>Best</small><b id="best">0</b></div>
    <button class="icon" id="pause" aria-label="Pause">⏸</button>
    <button class="icon" id="mute" aria-label="Toggle sound">🔊</button>
  </header>
  <div class="wrap">
    <canvas id="board" aria-label="Snake game board"></canvas>
    <div id="overlay"><h1 id="ot">Snake</h1><p id="om"></p><button id="go">Play</button></div>
  </div>
  <footer>Arrows / <kbd>WASD</kbd> or swipe to steer · <kbd>Space</kbd> to pause</footer>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), cv=$('board'), ctx=cv.getContext('2d');
const N=20, DIRS={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
let cell=24, snake, dir, queue, food, score, best=0, state='ready', timer, speed, muted=false, actx;
try{best=+localStorage.getItem('snake-best')||0;muted=localStorage.getItem('snake-mute')==='1'}catch(e){}

function beep(f,d=.08){ if(muted)return; try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.08;
  o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.stop(actx.currentTime+d);}catch(e){} }

function fit(){ const s=Math.min(innerWidth-32,innerHeight-170,560); cell=Math.max(12,Math.floor(s/N));
  const px=cell*N,d=devicePixelRatio||1; cv.style.width=cv.style.height=px+'px'; cv.width=cv.height=px*d; ctx.setTransform(d,0,0,d,0,0); draw(); }

function reset(){ snake=[{x:10,y:10},{x:10,y:11},{x:10,y:12}]; dir={x:0,y:-1}; queue=[]; score=0; speed=130; placeFood(); hud(); }
function placeFood(){ const free=[]; for(let x=0;x<N;x++)for(let y=0;y<N;y++) if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});
  food=free.length?free[Math.random()*free.length|0]:null; }
function hud(){ $('score').textContent=score; $('best').textContent=best; $('mute').textContent=muted?'🔇':'🔊'; }

function show(title,msg,btn){ $('ot').textContent=title; $('om').innerHTML=msg; $('go').textContent=btn; $('overlay').classList.remove('hidden'); }
function hide(){ $('overlay').classList.add('hidden'); }

function start(){ reset(); state='play'; hide(); $('pause').textContent='⏸'; clearTimeout(timer); loop(); }
function loop(){ if(state!=='play')return; tick(); if(state==='play') timer=setTimeout(loop,speed); }
function pause(){ if(state==='play'){state='pause';clearTimeout(timer);$('pause').textContent='▶';show('Paused','Take a breath.','Resume');}
  else if(state==='pause'){state='play';hide();$('pause').textContent='⏸';loop();} }

function tick(){
  if(queue.length) dir=queue.shift();
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y}, eat=food&&h.x===food.x&&h.y===food.y;
  const body=eat?snake:snake.slice(0,-1);
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(s=>s.x===h.x&&s.y===h.y)) return over();
  snake.unshift(h);
  if(eat){ score++; speed=Math.max(65,speed-3); beep(660); placeFood(); if(score>best){best=score;try{localStorage.setItem('snake-best',best)}catch(e){}} hud(); if(!food) return over(true); }
  else snake.pop();
  draw();
}
function over(win){ state='over'; clearTimeout(timer); beep(win?880:140,.35); draw();
  show(win?'You win! 🎉':'Game over',`Score <b>${score}</b> · Best <b>${best}</b>`,'Play again'); }

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h); ctx.fill(); }
function draw(){
  if(!snake)return; const W=cell*N;
  ctx.fillStyle='#0f1630'; ctx.fillRect(0,0,W,W);
  ctx.fillStyle='#131c3b'; for(let x=0;x<N;x++)for(let y=0;y<N;y++) if((x+y)%2) ctx.fillRect(x*cell,y*cell,cell,cell);
  if(food){ const cx=(food.x+.5)*cell, cy=(food.y+.5)*cell; ctx.shadowColor='#fb7185'; ctx.shadowBlur=cell*.8;
    ctx.fillStyle='#fb7185'; ctx.beginPath(); ctx.arc(cx,cy,cell*.34,0,7); ctx.fill(); ctx.shadowBlur=0; }
  const p=cell*.08;
  snake.forEach((s,i)=>{ const t=i/Math.max(1,snake.length-1); ctx.fillStyle=`hsl(${142-t*20} ${75-t*15}% ${58-t*22}%)`;
    rr(s.x*cell+p,s.y*cell+p,cell-p*2,cell-p*2,cell*.3); });
  const h=snake[0], ex=-dir.y, ey=dir.x, cx=(h.x+.5)*cell+dir.x*cell*.15, cy=(h.y+.5)*cell+dir.y*cell*.15;
  ctx.fillStyle='#06220f'; for(const k of[-1,1]){ ctx.beginPath(); ctx.arc(cx+ex*k*cell*.2,cy+ey*k*cell*.2,cell*.08,0,7); ctx.fill(); }
}

function turn(x,y){ if(state==='ready'||state==='over')return; if(state==='pause')pause();
  const last=queue.length?queue[queue.length-1]:dir; if((last.x===x&&last.y===y)||(last.x===-x&&last.y===-y))return;
  if(queue.length<2)queue.push({x,y}); }

addEventListener('keydown',e=>{ const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k===' '){e.preventDefault(); state==='ready'||state==='over'?start():pause(); return;}
  if(k==='Enter'&&(state==='ready'||state==='over')){start();return;}
  if(DIRS[k]){e.preventDefault(); if(state==='ready'||state==='over')start(); turn(...DIRS[k]);} });
let t0; addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
addEventListener('touchend',e=>{ if(!t0)return; const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY; t0=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return; if(state==='ready'||state==='over')start();
  Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy)); },{passive:true});
$('go').onclick=()=>state==='pause'?pause():start();
$('pause').onclick=()=>{ if(state==='play'||state==='pause')pause(); };
$('mute').onclick=()=>{ muted=!muted; try{localStorage.setItem('snake-mute',muted?'1':'0')}catch(e){} hud(); };
addEventListener('blur',()=>{ if(state==='play')pause(); });
addEventListener('resize',fit);

reset(); fit(); show('Snake','Eat the glowing food, avoid walls and yourself.<br>Press any arrow key or swipe to begin.','Play');
})();
</script>
</body>
</html>
